<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON INVADERS</title><style>
*{box-sizing:border-box}body{margin:0;background:#050816;color:#c7fff8;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh}main{width:min(96vw,720px);text-align:center}h1{color:#5fffe0;text-shadow:0 0 18px #00ffbb;letter-spacing:5px;margin:12px 0}canvas{width:100%;height:auto;border:2px solid #36bfae;background:#050816;box-shadow:0 0 30px #00e0b533;touch-action:none}p{color:#9bb4bd;font-size:13px}button{background:#102a36;border:1px solid #5fffe0;color:#c7fff8;padding:12px 20px;font:inherit;cursor:pointer;margin:5px}button:hover{background:#1b5360}.controls{display:flex;justify-content:center;gap:12px}.controls button{min-width:75px;touch-action:none;user-select:none}#status{min-height:20px}</style></head><body><main><h1>NEON INVADERS</h1><canvas id="game" width="640" height="720" aria-label="Space Invaders Spiel"></canvas><div><button id="start">START / NEUSTART</button><button id="mute">🔊 SOUND AN</button></div><div class="controls"><button id="left">◀</button><button id="fire">● FEUER</button><button id="right">▶</button></div><p>← → / A D bewegen · LEERTASTE feuern · P pausieren · Enter starten</p><p id="status">Bereit für die Invasion?</p></main><script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),W=640,H=720;let state='title',score=0,high=Number(localStorage.getItem('neonInvadersHigh')||0),lives=3,wave=1,player,aliens=[],shots=[],enemyShots=[],particles=[],stars=[],barriers=[],direction=1,alienStep=0,alienTimer=0,shootCooldown=0,enemyCooldown=0,clock=0,last=0,muted=false,audio=null,beat=0;const keys={left:false,right:false,fire:false};const rand=(a,b)=>a+Math.random()*(b-a);function sound(freq,duration,type='square',vol=.035,slide=0){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(Math.max(1,freq),t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(1,freq+slide),t+duration);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration)}catch(e){}}function boom(px,py,color,n=16){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:rand(-130,130),vy:rand(-130,130),life:rand(.2,.7),color})}function setupWave(){aliens=[];for(let r=0;r<5;r++)for(let col=0;col<10;col++)aliens.push({x:62+col*53,y:92+r*43,row:r,alive:true});direction=1;alienTimer=0;alienStep=0;enemyCooldown=1;shots=[];enemyShots=[];barriers=[];for(let b=0;b<4;b++)for(let i=0;i<7;i++)for(let j=0;j<3;j++)if(!(j===2&&i>=2&&i<=4))barriers.push({x:74+b*143+i*10,y:558+j*11,hp:3})}function reset(){score=0;lives=3;wave=1;player={x:W/2,y:652,w:38,h:22,inv:0};particles=[];setupWave();state='play';document.getElementById('status').textContent='Viel Erfolg, Pilot!';sound(440,.1)}function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function drawAlien(a){const col=['#ff6b9a','#ff9b70','#ffd76b','#83e68a','#63dfff'][a.row];x.fillStyle=col;x.shadowColor=col;x.shadowBlur=10;const px=a.x,py=a.y;const pattern=['00100100','01111110','11111111','11011011','11111111','00100100','01011010','10100101'];for(let r=0;r<8;r++)for(let q=0;q<8;q++)if(pattern[r][q]==='1')x.fillRect(px+q*3.5,py+r*3.5,3.5,3.5);x.shadowBlur=0}function update(dt){clock+=dt;for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(state!=='play')return;player.inv=Math.max(0,player.inv-dt);player.x=Math.max(24,Math.min(W-24,player.x+((keys.right?1:0)-(keys.left?1:0))*320*dt));shootCooldown-=dt;if(keys.fire&&shootCooldown<=0){shots.push({x:player.x-2,y:player.y-18,w:4,h:16});shootCooldown=.22;sound(650,.09,'sawtooth',.025,-480)}for(const s of shots)s.y-=470*dt;for(const s of enemyShots)s.y+=(175+wave*13)*dt;shots=shots.filter(s=>s.y>-30);enemyShots=enemyShots.filter(s=>s.y<H+20);alienTimer+=dt;const remaining=aliens.filter(a=>a.alive);const interval=Math.max(.055,.55-wave*.025-(50-remaining.length)*.008);if(alienTimer>=interval&&remaining.length){alienTimer=0;const edge=remaining.some(a=>a.x+(direction*12)<15||a.x+(direction*12)>W-45);if(edge){direction*=-1;remaining.forEach(a=>a.y+=19)}else remaining.forEach(a=>a.x+=direction*12);sound([110,92,82,73][beat++%4],.055,'square',.018)}enemyCooldown-=dt;if(enemyCooldown<=0&&remaining.length){const a=remaining[Math.floor(Math.random()*remaining.length)];enemyShots.push({x:a.x+12,y:a.y+28,w:5,h:13});enemyCooldown=rand(.38,1.1)*Math.max(.5,1-wave*.04);sound(160,.05,'triangle',.01)}for(const s of shots){for(const a of aliens){if(a.alive&&rect(s,{x:a.x,y:a.y,w:28,h:28})){a.alive=false;s.y=-100;score+=(5-a.row)*10;boom(a.x+14,a.y+14,['#ff6b9a','#ff9b70','#ffd76b','#83e68a','#63dfff'][a.row]);sound(230,.17,'sawtooth',.04,-170);break}}}for(const s of [...shots,...enemyShots])for(const b of barriers){if(b.hp>0&&rect(s,{x:b.x,y:b.y,w:10,h:11})){b.hp--;s.y=s===shots.find(z=>z===s)?-100:H+100;boom(b.x+5,b.y+5,'#40eab8',3);break}}for(const s of enemyShots)if(player.inv<=0&&rect(s,{x:player.x-19,y:player.y-12,w:38,h:25})){s.y=H+100;lives--;player.inv=1.8;boom(player.x,player.y,'#64fff0',32);sound(140,.45,'sawtooth',.09,-125);if(lives<=0){state='over';if(score>high){high=score;localStorage.setItem('neonInvadersHigh',high)}document.getElementById('status').textContent='Game Over – Enter zum Neustart'}}enemyShots=enemyShots.filter(s=>s.y<H+20);shots=shots.filter(s=>s.y>-30);if(aliens.some(a=>a.alive&&a.y+30>=player.y-10)){state='over';document.getElementById('status').textContent='Die Invasion hat gewonnen!'}if(aliens.every(a=>!a.alive)){wave++;lives=Math.min(5,lives+1);setupWave();sound(440,.15);setTimeout(()=>sound(660,.2),130)}}function draw(){x.fillStyle='#050816';x.fillRect(0,0,W,H);for(const s of stars){s.y+=.12;if(s.y>H)s.y=0;x.fillStyle=`rgba(150,220,255,${s.a})`;x.fillRect(s.x,s.y,s.r,s.r)}x.strokeStyle='#143e45';x.beginPath();x.moveTo(0,686);x.lineTo(W,686);x.stroke();x.font='bold 20px monospace';x.fillStyle='#5fffe0';x.fillText('SCORE '+String(score).padStart(5,'0'),20,35);x.fillText('HI '+String(Math.max(high,score)).padStart(5,'0'),245,35);x.fillText('♥'.repeat(lives),515,35);x.font='14px monospace';x.fillText('WELLE '+wave,20,60);for(const b of barriers)if(b.hp>0){x.fillStyle=['','#237b6a','#2fc49d','#64ffca'][b.hp];x.fillRect(b.x,b.y,10,11)}for(const a of aliens)if(a.alive)drawAlien(a);if(player&&(player.inv<=0||Math.floor(clock*12)%2===0)){x.fillStyle='#5fffe0';x.shadowColor='#5fffe0';x.shadowBlur=15;x.beginPath();x.moveTo(player.x,player.y-20);x.lineTo(player.x+22,player.y+13);x.lineTo(player.x+10,player.y+9);x.lineTo(player.x-10,player.y+9);x.lineTo(player.x-22,player.y+13);x.closePath();x.fill();x.shadowBlur=0}x.fillStyle='#eaff77';for(const s of shots)x.fillRect(s.x,s.y,s.w,s.h);x.fillStyle='#ff718e';for(const s of enemyShots)x.fillRect(s.x,s.y,s.w,s.h);for(const p of particles){x.globalAlpha=Math.min(1,p.life*2);x.fillStyle=p.color;x.fillRect(p.x,p.y,4,4)}x.globalAlpha=1;if(state!=='play'){x.fillStyle='#030b19d9';x.fillRect(45,240,550,205);x.textAlign='center';x.fillStyle='#5fffe0';x.shadowColor='#00ffc3';x.shadowBlur=18;x.font='bold 39px monospace';x.fillText(state==='title'?'NEON INVADERS':state==='pause'?'PAUSE':'GAME OVER',320,315);x.shadowBlur=0;x.font='18px monospace';x.fillStyle='#fff';x.fillText(state==='over'?'Punkte: '+score:'Retro-Arcade mit Synth-Sound',320,358);x.font='16px monospace';x.fillStyle='#9ee5d9';x.fillText('ENTER oder START drücken',320,395);x.textAlign='left'}}function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}for(let i=0;i<95;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.5,2),a:rand(.2,.8)});function bind(btn,key){const el=document.getElementById(btn);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[key]=false)}bind('left','left');bind('right','right');bind('fire','fire');window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright',' ','a','d'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' ')keys.fire=true;if(k==='enter'&&state!=='play')reset();if(k==='p'){state=state==='play'?'pause':state==='pause'?'play':state}});window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k===' ')keys.fire=false});window.addEventListener('blur',()=>{keys.left=keys.right=keys.fire=false;if(state==='play')state='pause'});document.getElementById('start').onclick=reset;document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'🔇 SOUND AUS':'🔊 SOUND AN'};requestAnimationFrame(frame)})();
</script></body></html>
