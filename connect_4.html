  --coin-yellow:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAArElEQVR42u2TLRLDIBCFH0xB1WBQxETlFhy1Z8ktUDGgMPEgUhMY/hLRVvbNYJb93op9SzAQYzhG9RhB2hoZgcGoEQ++uM6IlHAGZzs0wDZlo2TyqOAEno2dZgv/eiIYBb64I0YQejUFs83Pr/ulMa2mtw3b1NWkFvDrjmAUGMNB8aX+BmcO+OIQzNRtIq+vkdQih4mUQUqA1GIIlv+VQRvlu8ltlH93TJ+e8xsQJ1wyzixSpgAAAABJRU5ErkJggg==");

*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh; margin:0; background:var(--background); color:var(--ink);
  font-family:"Courier New",Courier,monospace; font-weight:700; letter-spacing:.01em;
}
button{cursor:pointer;font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px dashed #ffe38e;outline-offset:5px}
button:disabled{cursor:default}
[hidden]{display:none!important}
.shell{width:min(calc(100% - 40px),900px);margin:0 auto}
#setup-screen{max-width:660px;margin:clamp(24px,8vh,76px) auto 58px}
.setup-panel{
  padding:30px;background:var(--surface);border:4px solid #0a1325;
  box-shadow:8px 8px 0 #080e1c;
}
.setting+.setting{border-top:3px dashed #53709b;margin-top:29px;padding-top:27px}
.setting-head{display:flex;gap:13px;align-items:center;margin-bottom:17px}
.setting-index{
  background:#f5c752;color:#201d31;display:inline-grid;place-items:center;
  min-width:33px;height:31px;font-size:12px;font-weight:900;border:3px solid #131e32;
}
.setting-head h2{margin:0;font-size:14px;line-height:1.6;text-transform:uppercase;letter-spacing:.065em;color:#f5efcb}
.color-choices{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.color-choice{
  min-width:0;min-height:76px;display:flex;align-items:center;gap:13px;text-align:left;
  border:3px solid #10203d;border-radius:0;padding:11px 14px;background:#365581;
  box-shadow:4px 4px 0 #12203b;color:#e0edff;
  transition:none;
}
.color-choice:hover,.difficulty-choice:hover{background:#43679b}
.color-choice:active,.difficulty-choice:active,.primary-btn:active,.secondary-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #111b30}
.color-choice[aria-pressed="true"]{
  background:#416b9d;border-color:#ffde77;color:#fff6d9;
  box-shadow:4px 4px 0 #152642;
}
.color-choice .choice-label{flex:1;font-size:14px;font-weight:900;text-transform:uppercase}
.swatch,.preview-disc,.disc,.status-dot,.score-dot{
  display:block;flex:none;background-repeat:no-repeat;background-position:center;
  background-size:100% 100%;image-rendering:pixelated;border:0;border-radius:0;box-shadow:none;
}
.swatch{width:38px;height:38px}
.swatch.red,.disc.red{background-image:var(--coin-red)}
.swatch.yellow,.disc.yellow{background-image:var(--coin-yellow)}
.starter-icon{
  display:grid;place-items:center;height:34px;min-width:38px;background:#1a3052;
  border:3px solid #101d35;color:#f7d16d;font-size:11px;font-weight:900;
}
.starter-icon svg{display:none}
.starter-icon::after{content:'1UP';letter-spacing:-1px}
.color-choice[data-starter="computer"] .starter-icon::after{content:'CPU';letter-spacing:0}
.choice-check{visibility:hidden;color:#ffdf7b;font-size:23px;font-weight:900;line-height:1}
.color-choice[aria-pressed="true"] .choice-check{visibility:visible}
.difficulty-choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.difficulty-choice{
  min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  min-height:83px;padding:12px 2px;border:3px solid #10203d;border-radius:0;
  background:#365581;color:#c0d0e8;box-shadow:4px 4px 0 #12203b;transition:none;
}
.difficulty-choice[aria-pressed="true"]{border-color:#ffde77;background:#416b9d;color:#fff3c3}
.difficulty-num{font-size:23px;line-height:1;font-weight:900;letter-spacing:.06em}
.difficulty-name{font-size:10px;white-space:nowrap;font-weight:900;letter-spacing:-.035em}
.primary-btn{
  display:inline-flex;justify-content:center;align-items:center;gap:12px;border:3px solid #131a2b;
  border-radius:0;min-height:57px;padding:12px 20px;background:#ffd15b;color:#202139;
  box-shadow:6px 6px 0 #0d152a;font-size:15px;font-weight:900;letter-spacing:.07em;
  text-transform:uppercase;transition:none;
}
.primary-btn:hover{background:#ffe084}
.primary-btn .arrow{font-size:22px}
.start-btn{width:100%;margin-top:26px}
#game-screen{max-width:750px;margin:clamp(20px,5vh,55px) auto 60px}
.game-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:23px}
.game-heading>div:first-child{flex:1;min-width:0}
.eyebrow{display:block;color:#ffcf5b;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.game-heading h1{
  display:block;width:min(390px,100%);aspect-ratio:71/7;
  margin:0;background:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEcAAAAHCAYAAABa6FBzAAAAlUlEQVR42t1U2w3AIAjUxgG6U+d2JzegPzWhFAinfSS9LyF4XOQwU6uU1y2nAz2mVikJIHnOaUG74/GjOq36KM9FIBqjdSjPjE6e62crr8VL+jHQDZAoI005sbQoslbWHY9HrsWTKKMT8SaFiI88yFfuWXjRHVOJWvbt9ULyJ+dYv7g8a1PWmkQc5D2ixs85ObencxY7pujjwbaU/FAAAAAASUVORK5CYII=") center left/contain no-repeat;image-rendering:pixelated;
}
.screen-reader-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.turn-status{
  display:flex;align-items:center;gap:8px;padding:11px 12px;background:#304c78;color:#fff2c5;
  border:3px solid #101c34;box-shadow:4px 4px 0 #0a1325;font-size:11px;font-weight:900;
  white-space:nowrap;text-transform:uppercase;
}
.status-dot,.score-dot{width:20px;height:20px;background-image:var(--coin-red)}
.status-dot.yellow,.score-dot.yellow{background-image:var(--coin-yellow)}
.turn-status.thinking .status-dot{animation:blink .65s steps(1,end) infinite}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:21px}
.score-box{
  display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;
  background:#233758;border:3px solid #0d182c;padding:12px 14px;
  box-shadow:4px 4px 0 #0a1122;
}
.score-label{display:flex;align-items:center;gap:7px;color:#d1ddf3;font-size:11px;font-weight:900;text-transform:uppercase}
.score-number{color:#ffd45e;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.draw-icon{display:grid;place-items:center;color:#fed675;background:#152541;border:2px solid #7693ba;width:20px;height:20px;font-size:13px;font-weight:900}
.board-stage{
  --board-padding:clamp(9px,2vw,16px);--cell-gap:clamp(4px,1.3vw,10px);
  max-width:652px;margin:0 auto;
}
.preview-row{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--cell-gap);
  padding:0 calc(var(--board-padding) + 5px);height:39px;align-items:center;
}
.preview-hole{min-width:0;display:grid;place-items:center}
.preview-disc{width:29px;height:29px;opacity:0;background-image:var(--coin-red)}
.preview-disc.yellow{background-image:var(--coin-yellow)}
.preview-hole.active .preview-disc{opacity:1;animation:coin-bob .45s steps(2,end) infinite alternate}
.board-frame{
  position:relative;border:5px solid #0b152b;border-radius:0;padding:var(--board-padding);
  background:#3965a3;box-shadow:8px 8px 0 #0a1023,inset 5px 5px 0 #628fc2,inset -5px -5px 0 #234472;
}
.board-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--cell-gap)}
.slot{
  position:relative;min-width:0;aspect-ratio:1;background:var(--well) center/100% 100% no-repeat;
  image-rendering:pixelated;
}
.disc{
  position:absolute;inset:1%;z-index:1;
  image-rendering:pixelated;
}
.slot.last{outline:3px dashed #ffefae;outline-offset:-2px}
.slot.win::after{
  content:"";position:absolute;z-index:2;inset:-2px;border:3px dashed #fff1b1;
  animation:blink .4s steps(1,end) 6;
}
.column-controls{
  position:absolute;inset:var(--board-padding);display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--cell-gap);
}
.column-hit{min-width:0;border:0;border-radius:0;background:transparent;padding:0;touch-action:manipulation}
.column-hit:not(:disabled):hover,.column-hit:not(:disabled):focus-visible{background:#f4f5cf20;outline:2px dashed #e1f0f8;outline-offset:-2px}
.column-hit:disabled{pointer-events:none}
.result{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:3px solid #f4c755;background:#213a63;padding:15px;margin-top:23px;
  box-shadow:5px 5px 0 #0d1628;
}
.result-title{margin:0 0 7px;font-size:14px;color:#ffdc72;text-transform:uppercase}
.result-sub{margin:0;color:#d6e2ed;font-size:11px;line-height:1.55;font-weight:700}
.result-btn{
  flex:none;white-space:nowrap;border:3px solid #0c1930;border-radius:0;
  background:#ffda70;color:#1d2540;padding:12px;font-size:11px;font-weight:900;text-transform:uppercase;
  box-shadow:3px 3px 0 #11172c;
}
.result-btn:hover{background:#ffe69c}
.game-actions{display:flex;align-items:center;justify-content:space-between;margin-top:26px;gap:13px;flex-wrap:wrap}
.action-buttons{display:flex;flex-wrap:wrap;gap:12px}
.secondary-btn{
  border:3px solid #0a152c;border-radius:0;background:#345783;color:#f8ecc5;
  box-shadow:4px 4px 0 #090f20;padding:11px 13px;font-size:11px;font-weight:900;
  text-transform:uppercase;transition:none;
}
.secondary-btn:hover{background:#436c9c}
.text-btn{
  background:none;border:0;color:#b2c8e5;font-size:10px;font-weight:900;
  padding:12px 2px;text-transform:uppercase;text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:5px;
}
.text-btn:hover{color:#ffe087}
@keyframes blink{50%{opacity:0}}
@keyframes coin-bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@media(max-width:650px){
  .shell{width:min(calc(100% - 26px),900px)}
  #setup-screen{margin-top:22px}
  .setup-panel{padding:19px;box-shadow:5px 5px 0 #080e1c}
  .setting+.setting{padding-top:21px;margin-top:23px}
  .setting-head h2{font-size:12px}
  .color-choice{min-height:67px;padding:9px;gap:9px}
  .swatch{width:30px;height:30px}
  .starter-icon{min-width:30px;height:30px;font-size:9px}
  .color-choice .choice-label{font-size:12px}
  .difficulty-choices{gap:5px}
  .difficulty-choice{min-height:73px;padding:9px 1px;gap:9px;box-shadow:2px 2px 0 #12203b}
  .difficulty-num{font-size:19px}
  .difficulty-name{font-size:9px;letter-spacing:-.07em}
  .game-heading{align-items:flex-start}
  .eyebrow{font-size:9px}
  .game-heading h1{width:min(360px,100%)}
  .turn-status{padding:8px 7px;gap:4px;font-size:9px}
  .status-dot{width:15px;height:15px}
  .scores{gap:6px}
  .score-box{padding:10px 7px;box-shadow:2px 2px 0 #0a1122}
  .score-label{font-size:10px;gap:4px}
  .score-number{font-size:18px}
  .score-dot{width:16px;height:16px}
  .board-frame{border-width:4px;box-shadow:5px 5px 0 #0a1023}
  .preview-row{padding:0 calc(var(--board-padding) + 4px);height:32px}
  .preview-disc{width:22px;height:22px}
  .result{align-items:flex-start}
  .result-btn{padding:9px;font-size:10px}
}
@media(max-width:390px){
  .shell{width:min(calc(100% - 18px),900px)}
  .setup-panel{padding:12px}
  .difficulty-name{font-size:8px}
  .color-choice .choice-label{font-size:10px}
  .color-choice{gap:5px}
  .choice-check{font-size:17px}
  .setting-head h2{font-size:11px}
  .score-box{flex-direction:column;align-items:flex-start;gap:5px}
  .turn-status{font-size:8px}
  .result{flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <section id="setup-screen" aria-label="Spieleinstellungen">
        <div class="setup-panel">
          <div class="setting">
            <div class="setting-head"><span class="setting-index">01</span><h2>Wähle deine Farbe</h2></div>
            <div class="color-choices" role="group" aria-label="Chipfarbe">
              <button type="button" class="color-choice" data-color="red" aria-pressed="true"><span class="swatch red" aria-hidden="true"></span><span class="choice-label">Rot</span><span class="choice-check" aria-hidden="true">✓</span></button>
              <button type="button" class="color-choice" data-color="yellow" aria-pressed="false"><span class="swatch yellow" aria-hidden="true"></span><span class="choice-label">Gelb</span><span class="choice-check" aria-hidden="true">✓</span></button>
            </div>
          </div>

                <span class="choice-label">Computer</span><span class="choice-check" aria-hidden="true">✓</span>
              </button>
            </div>
          </div>
          <div class="setting">
            <div class="setting-head"><span class="setting-index">03</span><h2>Wähle die Schwierigkeit</h2></div>

              <button type="button" class="difficulty-choice" data-level="1" aria-pressed="false"><span class="difficulty-num">02</span><span class="difficulty-name">Leicht</span></button>
              <button type="button" class="difficulty-choice" data-level="2" aria-pressed="true"><span class="difficulty-num">03</span><span class="difficulty-name">Mittel</span></button>
              <button type="button" class="difficulty-choice" data-level="3" aria-pressed="false"><span class="difficulty-num">04</span><span class="difficulty-name">Schwer</span></button>
              <button type="button" class="difficulty-choice" data-level="4" aria-pressed="false"><span class="difficulty-num">05</span><span class="difficulty-name">Experte</span></button>
            </div>
          </div>
          <button type="button" id="start-button" class="primary-btn start-btn">Spiel starten <span class="arrow" aria-hidden="true">→</span></button>
        </div>
      </section>

      <section id="game-screen" aria-labelledby="game-title" hidden>
        <div class="game-heading">
          <div><span class="eyebrow" id="game-level">LEVEL 03 · MITTEL</span><h1 id="game-title"><span class="screen-reader-only">Vier Gewinnt</span></h1></div>
          <div id="turn-status" class="turn-status" role="status" aria-live="polite"><span class="status-dot" id="status-dot" aria-hidden="true"></span><span id="status-text">Du bist am Zug</span></div>
        </div>

        <div class="scores" aria-label="Punktestand">
          <div class="score-box"><span class="score-label"><span class="score-dot" id="player-score-dot" aria-hidden="true"></span>Du</span><span class="score-number" id="player-score">0</span></div>
          <div class="score-box"><span class="score-label"><span class="score-dot yellow" id="computer-score-dot" aria-hidden="true"></span>Computer</span><span class="score-number" id="computer-score">0</span></div>

          </div>
          <div class="result" id="result" role="status" aria-live="polite" hidden>
            <div><p class="result-title" id="result-title"></p><p class="result-sub" id="result-sub"></p></div>
            <button type="button" class="result-btn" id="again-button">Nochmal spielen ↗</button>
          </div>
        </div>

        <div class="game-actions">
          <div class="action-buttons">
            <button type="button" class="secondary-btn" id="new-round-button">↻ &nbsp; Neue Runde</button>
            <button type="button" class="secondary-btn" id="settings-button">Einstellungen</button>
            <button type="button" class="secondary-btn" id="sound-button" aria-pressed="true" aria-label="Ton ausschalten">♪ Ton an</button>
          </div>
          <button type="button" class="text-btn" id="reset-scores-button">Punktestand zurücksetzen</button>
        </div>
      </section>
    </main>

  </div>

  <script>
    'use strict';

    // Der Computer läuft in einem eigenen Worker. Der Worker wird vollständig
    // aus dieser HTML-Datei erzeugt – keine zusätzlichen Dateien oder APIs nötig.
    const AI_WORKER_SOURCE = String.raw`
      'use strict';
      const WIDTH = 7, HEIGHT = 6, ORDER = [3,2,4,1,5,0,6];
      const LINES = [];
      for (let r = 0; r < HEIGHT; r++) for (let c = 0; c < WIDTH; c++) {
        if (c <= 3) LINES.push([r*7+c,r*7+c+1,r*7+c+2,r*7+c+3]);
        if (r <= 2) LINES.push([r*7+c,(r+1)*7+c,(r+2)*7+c,(r+3)*7+c]);
        if (c <= 3 && r <= 2) LINES.push([r*7+c,(r+1)*7+c+1,(r+2)*7+c+2,(r+3)*7+c+3]);
        if (c >= 3 && r <= 2) LINES.push([r*7+c,(r+1)*7+c-1,(r+2)*7+c-2,(r+3)*7+c-3]);
      }
      let board, heights, occupied, nodes, deadline, table;
      const WIN = 1000000, TIMEOUT = { timeout: true };
      const WEIGHTS = [0, 3, 7, 12, 7, 3, 0];
      const ZOBRIST = [];
      let randomSeed = 0x51ca497f;
      function rand32() { randomSeed ^= randomSeed << 13; randomSeed ^= randomSeed >>> 17; randomSeed ^= randomSeed << 5; return randomSeed >>> 0; }
      for (let i = 0; i < 84; i++) ZOBRIST.push(rand32());
      const TURN_KEY = rand32();

      function drop(c, p) {
        const r = 5 - heights[c];

    // Web Audio ist auch für den Computer als Startspieler zuverlässig:
    // Der Audiokontext wird beim Klick auf „Spiel starten“ freigeschaltet.
    const sounds = (() => {
      let context=null, ready=null, muted=false, epoch=0;
      const buffers={};
      const playing=new Set();
      const scheduled=new Set();

      function decodeBase64(encoded) {
        const binary=atob(encoded);
        const bytes=new Uint8Array(binary.length);
        for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
        return bytes.buffer;
      }

      function unlock() {
        if (muted) return Promise.resolve();
        try {
          const Ctx=window.AudioContext||window.webkitAudioContext;
          if (!Ctx) return Promise.resolve();
          if (!context) context=new Ctx();
          const running=context.state==='suspended' ? context.resume() : Promise.resolve();
          if (!ready) {
            ready=Promise.all(Object.entries(SOUND_WAV).map(async ([name,encoded])=>{
              buffers[name]=await context.decodeAudioData(decodeBase64(encoded));
            })).catch(()=>{});
          }
          return Promise.all([running,ready]).catch(()=>{});
        } catch (_) { return Promise.resolve(); }
      }

      async function play(name) {
        if (muted) return;
        const generation=epoch;
        await unlock();
        if (muted || epoch!==generation || !context || context.state!=='running' || !buffers[name]) return;
        try {
          const source=context.createBufferSource();
          source.buffer=buffers[name];
          source.connect(context.destination);
          playing.add(source);
          source.onended=()=>playing.delete(source);
          source.start();
        } catch (_) { /* Browser ohne Audioausgabe: Spiel läuft weiter. */ }
      }

      function playDelayed(name,delayMs) {
        const generation=epoch;
        const timer=setTimeout(()=>{
          scheduled.delete(timer);
          if (epoch===generation) void play(name);
        },delayMs);
        scheduled.add(timer);
      }

      function stopAll() {
        epoch++;
        for (const timer of scheduled) clearTimeout(timer);
        scheduled.clear();
        for (const source of playing) {
          try { source.stop(); } catch (_) {}
        }
        playing.clear();
      }

      function setMuted(value) {
        muted=!!value;
        if (muted) stopAll();
        else void unlock();
      }

      return {unlock,play,playDelayed,stopAll,setMuted,isMuted:()=>muted};
    })();

    const $ = (id) => document.getElementById(id);
    const slots = [];
    const columnButtons = [];
    const previewHoles = [];
    const levelNames = ['Sehr leicht', 'Leicht', 'Mittel', 'Schwer', 'Experte'];
    const state = {
      color: 'red', starter: 'human', level: 2,
      board: new Int8Array(42), heights: Array(7).fill(0),
      turn: 'human', finished: false, generation: 0,
      worker: null, pendingAI: null, hoverColumn: null,
      scores: {human:0, computer:0, draw:0}
    };

    function loadScores() {
      try {
        const stored = JSON.parse(localStorage.getItem('vier-gewinnt-scores-v1'));
        if (stored && ['human','computer','draw'].every(k => Number.isSafeInteger(stored[k]) && stored[k]>=0)) state.scores=stored;
      } catch (_) { /* Private Browsing kann Speicher verhindern. */ }
      updateScores();
    }
    function saveScores() { try { localStorage.setItem('vier-gewinnt-scores-v1',JSON.stringify(state.scores)); } catch (_) {} }
    function updateScores() {
      $('player-score').textContent=state.scores.human;
      $('computer-score').textContent=state.scores.computer;
      $('draw-score').textContent=state.scores.draw;
    }
    function otherColor() { return state.color==='red' ? 'yellow' : 'red'; }
    function chipColor(player) { return player===1 ? state.color : otherColor(); }

    function createBoard() {
      for (let r=0;r<6;r++) for (let c=0;c<7;c++) {
        const slot=document.createElement('div');
        slot.className='slot'; slot.dataset.row=r; slot.dataset.column=c;
        $('board-grid').appendChild(slot);
        slots.push(slot);
      }
      for (let c=0;c<7;c++) {
        const hole=document.createElement('div');
        hole.className='preview-hole';
        const disc=document.createElement('span'); disc.className='preview-disc';
        hole.appendChild(disc); $('preview-row').appendChild(hole); previewHoles.push(hole);
        const button=document.createElement('button');
        button.type='button'; button.className='column-hit';
        button.setAttribute('aria-label','Chip in Spalte '+(c+1)+' einwerfen');
        button.addEventListener('click',()=>humanMove(c));
        button.addEventListener('pointerenter',()=>setHover(c));
        button.addEventListener('pointerleave',()=>setHover(null));
        button.addEventListener('focus',()=>setHover(c));
        button.addEventListener('blur',()=>setHover(null));
        button.addEventListener('keydown',(e)=>{
          if (e.key==='ArrowRight' || e.key==='ArrowLeft') {
            e.preventDefault();
            const step=e.key==='ArrowRight'?1:-1;
            for (let offset=1;offset<=7;offset++) {
              const next=(c+step*offset+70)%7;
              if (!columnButtons[next].disabled) { columnButtons[next].focus(); break; }
            }
          }
        });
        $('column-controls').appendChild(button); columnButtons.push(button);
      }
    }
    function setHover(column) {
      state.hoverColumn=column;
      previewHoles.forEach((hole,c)=>{
        hole.classList.toggle('active', c===column && state.turn==='human' && !state.finished && state.heights[c]<6);
      });
    }
    function updateControls() {
      columnButtons.forEach((button,c)=>{ button.disabled=state.turn!=='human'||state.finished||state.heights[c]===6; });
      setHover(state.hoverColumn);
    }
    function setStatus(message, player, thinking=false) {
      $('status-text').textContent=message;
      $('status-dot').className='status-dot'+(chipColor(player)==='yellow'?' yellow':'');
      $('turn-status').classList.toggle('thinking',thinking);
    }
    function selectColor(color) {
      state.color=color;
      document.querySelectorAll('[data-color]').forEach(btn=>btn.setAttribute('aria-pressed', String(btn.dataset.color===color)));
    }
    function selectStarter(starter) {
      state.starter=starter;
      document.querySelectorAll('[data-starter]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.starter===starter)));
    }
    function selectLevel(level) {
      state.level=level;
      document.querySelectorAll('[data-level]').forEach(btn=>btn.setAttribute('aria-pressed',String(Number(btn.dataset.level)===level)));
    }
    function cancelPendingWork() {
      sounds.stopAll();
      state.generation++;
      if (state.worker) { state.worker.terminate(); state.worker=null; }
      if (state.pendingAI) { state.pendingAI(-1); state.pendingAI=null; }
    }
    function showScreen(screen) {
      $('setup-screen').hidden=screen!=='setup';
      $('game-screen').hidden=screen!=='game';
    }
    function beginGame() {
      showScreen('game');
      $('game-level').textContent='LEVEL '+String(state.level+1).padStart(2,'0')+' · '+levelNames[state.level].toUpperCase();
      $('player-score-dot').className='score-dot'+(state.color==='yellow'?' yellow':'');
      $('computer-score-dot').className='score-dot'+(otherColor()==='yellow'?' yellow':'');
      document.querySelectorAll('.preview-disc').forEach(d=>d.className='preview-disc'+(state.color==='yellow'?' yellow':''));
      newRound();
    }
    function newRound() {
      void sounds.unlock();
      cancelPendingWork();
      state.board.fill(0); state.heights.fill(0);
      state.finished=false; state.turn=state.starter; state.hoverColumn=null;
      slots.forEach(slot=>{slot.replaceChildren();slot.classList.remove('win','last');});
      $('result').hidden=true;
      if (state.starter==='computer') {
        setStatus('Computer denkt …',2,true);
        updateControls();
        void playComputerTurn(state.generation);
      } else {
        setStatus('Du bist am Zug',1);
        updateControls();
      }
    }
    function getWinningLine(col,row,player) {
      for (const [dc,dr] of [[1,0],[0,1],[1,1],[1,-1]]) {
        const line=[row*7+col];
        for (const direction of [-1,1]) {
          let c=col+dc*direction, r=row+dr*direction;
          while (c>=0&&c<7&&r>=0&&r<6&&state.board[r*7+c]===player) {
            line.push(r*7+c); c+=dc*direction; r+=dr*direction;
          }
        }
        if (line.length>=4) return line;
      }
      return null;
    }
    async function placeChip(column,player) {
      const generation=state.generation;
      const row=5-state.heights[column], index=row*7+column;
      if (row<0) return null;
      state.board[index]=player; state.heights[column]++;
      slots.forEach(slot=>slot.classList.remove('last'));
      const slot=slots[index]; slot.classList.add('last');
      const disc=document.createElement('div');
      disc.className='disc '+chipColor(player); slot.appendChild(disc);
      const reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduced && typeof disc.animate==='function') {
        const distance=slot.getBoundingClientRect().top - $('board-frame').getBoundingClientRect().top + slot.clientHeight + 22;
        const animation=disc.animate([
          {transform:'translateY(-'+Math.max(45,distance)+'px)'},
          {transform:'translateY(0)'}
        ],{duration:340,easing:'steps(9,end)',iterations:1});
        try { await animation.finished; } catch (_) {}
      }
      // Exakt beim Aufkommen des Chips: kurz und passend zum Pixel-Fall.
      if (generation===state.generation) void sounds.play('coin');
      return {row:row,column:column};
    }
    function finishGame(kind,line) {
      if (state.finished) return;
      state.finished=true; state.turn='done';
      if (kind==='human') sounds.playDelayed('victory',470);
      else if (kind==='computer') sounds.playDelayed('defeat',470);
      if (line) line.forEach(index=>slots[index].classList.add('win'));
      const title=kind==='human'?'Du hast gewonnen!':kind==='computer'?'Der Computer hat gewonnen.':'Unentschieden!';
      const subtitle=kind==='human'?'Stark gespielt. Lust auf eine weitere Runde?':kind==='computer'?'Nächste Runde, nächste Chance.':'Dieses Mal gibt es keinen Sieger.';
      state.scores[kind]++;
      saveScores(); updateScores();
      setStatus(kind==='draw'?'Unentschieden':kind==='human'?'Du gewinnst!':'Computer gewinnt', kind==='human'?1:2);
      $('result-title').textContent=title;
      $('result-sub').textContent=subtitle;
      $('result').hidden=false;
      updateControls();
    }
    function checkEnd(column,row,player) {
      const line=getWinningLine(column,row,player);
      if (line) { finishGame(player===1?'human':'computer',line); return true; }
      if (state.heights.every(h=>h===6)) { finishGame('draw',null); return true; }
      return false;
    }
    function delay(ms) { return new Promise(resolve=>setTimeout(resolve,ms)); }

    function fallbackMove() {
      // Auch ohne Worker wird mindestens ein gültiger und taktisch sinnvoller Zug gewählt.
      const options=[3,2,4,1,5,0,6].filter(c=>state.heights[c]<6);
      for (const player of [2,1]) {
        for (const c of options) {
          const r=5-state.heights[c];
          state.board[r*7+c]=player;
          const line=getWinningLine(c,r,player);
          state.board[r*7+c]=0;
          if (line) return c;
        }
      }
      return options.length?options[0]:-1;
    }
    function requestComputerMove() {
      return new Promise((resolve)=>{
        let settled=false, watchdog;
        const complete=(column)=>{
          if (settled) return;
          settled=true;
          clearTimeout(watchdog);
          if (state.worker) { state.worker.terminate(); state.worker=null; }
          state.pendingAI=null;
          resolve(column);
        };
        state.pendingAI=complete;
        try {
          const url=URL.createObjectURL(new Blob([AI_WORKER_SOURCE],{type:'text/javascript'}));
          const worker=new Worker(url);
          URL.revokeObjectURL(url);
          state.worker=worker;
          worker.onmessage=(event)=>{
            const col=event.data.column;
            complete(Number.isInteger(col)&&col>=0&&col<7&&state.heights[col]<6?col:fallbackMove());
          };
          worker.onerror=()=>complete(fallbackMove());
          watchdog=setTimeout(()=>complete(fallbackMove()),6500);
          worker.postMessage({board:Array.from(state.board),heights:state.heights.slice(),level:state.level});
        } catch (_) { complete(fallbackMove()); }
      });
    }
    async function humanMove(column) {
      if (state.turn!=='human'||state.finished||state.heights[column]>=6) return;
      void sounds.unlock();
      const generation=state.generation;
      state.turn='animating'; updateControls();
      const move=await placeChip(column,1);
      if (generation!==state.generation||!move) return;
      if (checkEnd(column,move.row,1)) return;
      await playComputerTurn(generation);
    }
    async function playComputerTurn(generation) {
      if (generation!==state.generation||state.finished) return;
      state.turn='computer';
      setStatus('Computer denkt …',2,true); updateControls();
      const [computerColumn]=await Promise.all([requestComputerMove(),delay(state.level>=3?380:490)]);
      if (generation!==state.generation||state.finished) return;
      if (computerColumn<0||state.heights[computerColumn]>=6) {
        const alternative=fallbackMove();
        if (alternative<0) { finishGame('draw',null); return; }
        await computerMove(alternative,generation);
      } else {
        await computerMove(computerColumn,generation);
      }
    }
    async function computerMove(column,generation) {
      state.turn='animating'; updateControls();
      const move=await placeChip(column,2);
      if (generation!==state.generation||!move) return;
      if (checkEnd(column,move.row,2)) return;
      state.turn='human';
      setStatus('Du bist am Zug',1); updateControls();
    }

    // Einrichtung und Bedienung
    createBoard();
    loadScores();
    document.querySelectorAll('[data-color]').forEach(btn=>btn.addEventListener('click',()=>selectColor(btn.dataset.color)));
    document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>selectLevel(Number(btn.dataset.level))));
    document.querySelectorAll('[data-starter]').forEach(btn=>btn.addEventListener('click',()=>selectStarter(btn.dataset.starter)));
    $('start-button').addEventListener('click',beginGame);
    $('new-round-button').addEventListener('click',newRound);
    $('again-button').addEventListener('click',newRound);
    $('settings-button').addEventListener('click',()=>{cancelPendingWork();showScreen('setup');});
    $('sound-button').addEventListener('click',()=>{
      const muted=!sounds.isMuted();
      sounds.setMuted(muted);
      $('sound-button').textContent=muted?'♪ Ton aus':'♪ Ton an';
      $('sound-button').setAttribute('aria-pressed',String(!muted));
      $('sound-button').setAttribute('aria-label',muted?'Ton einschalten':'Ton ausschalten');
    });
    $('reset-scores-button').addEventListener('click',()=>{state.scores={human:0,computer:0,draw:0};saveScores();updateScores();});
  </script>
</body>
</html>
